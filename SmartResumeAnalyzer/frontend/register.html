<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Create a CareerFit account.">
    <title>Create an Account | CareerFit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="css/auth.css">
    <script src="js/session.js" defer></script>
    <script src="js/auth.js" defer></script>
  </head>
  <body>
    <header class="auth-header">
      <a class="wordmark" href="index.html" aria-label="CareerFit home">CareerFit<span>.</span></a>
      <a class="back-link" href="index.html">Back to home</a>
    </header>

    <main class="auth-main auth-main-register">
      <section class="auth-card" aria-labelledby="auth-title">
        <a class="wordmark card-wordmark" href="index.html" aria-label="CareerFit home">CareerFit<span>.</span></a>
        <p class="eyebrow">Make your next move</p>
        <h1 id="auth-title">Create Your Account</h1>
        <p class="auth-subtitle">Start your journey towards better career opportunities.</p>
        <p class="demo-notice">Temporary demo only. Account details and passwords are not sent to a server or saved.</p>

        <form class="auth-form" data-auth-form="register" novalidate>
          <div class="form-field">
            <label for="register-name">Full Name</label>
            <input
              id="register-name"
              name="name"
              type="text"
              autocomplete="name"
              placeholder="Your full name"
              required
              aria-describedby="register-name-error"
            >
            <p class="field-error" id="register-name-error" aria-live="polite"></p>
          </div>

          <div class="form-field">
            <label for="register-email">Email Address</label>
            <input
              id="register-email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
              aria-describedby="register-email-error"
            >
            <p class="field-error" id="register-email-error" aria-live="polite"></p>
          </div>

          <div class="form-field">
            <label for="register-password">Password</label>
            <div class="password-control">
              <input
                id="register-password"
                name="password"
                type="password"
                autocomplete="new-password"
                placeholder="At least 8 characters"
                required
                minlength="8"
                aria-describedby="register-password-error password-strength"
              >
              <button class="password-toggle" type="button" aria-controls="register-password" aria-pressed="false">Show</button>
            </div>
            <p class="field-error" id="register-password-error" aria-live="polite"></p>
            <div class="strength-wrap">
              <div class="strength-meter" data-strength-meter>
                <span></span><span></span><span></span><span></span>
              </div>
              <p class="password-strength" id="password-strength" data-password-strength aria-live="polite">Password strength: Not entered</p>
            </div>
          </div>

          <div class="form-field">
            <label for="register-confirm-password">Confirm Password</label>
            <div class="password-control">
              <input
                id="register-confirm-password"
                name="confirmPassword"
                type="password"
                autocomplete="new-password"
                placeholder="Re-enter your password"
                required
                aria-describedby="register-confirm-password-error"
              >
              <button class="password-toggle" type="button" aria-controls="register-confirm-password" aria-pressed="false">Show</button>
            </div>
            <p class="field-error" id="register-confirm-password-error" aria-live="polite"></p>
          </div>

          <div class="form-field terms-field">
            <label class="checkbox-row" for="terms">
              <input id="terms" name="terms" type="checkbox" required aria-describedby="terms-error">
              <span>I agree to the Terms and Conditions.</span>
            </label>
            <p class="field-error" id="terms-error" aria-live="polite"></p>
          </div>

          <button class="submit-button" type="submit">Create Account</button>
          <p class="form-status" data-form-status role="status" aria-live="polite"></p>
        </form>

        <p class="auth-switch">
          Already have an account?
          <a class="text-link" href="login.html">Sign in</a>
        </p>
      </section>
    </main>
  </body>
</html>
