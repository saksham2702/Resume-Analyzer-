<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f1e9">
    <meta name="description" content="Sign in to CareerFit.">
    <title>Sign In | CareerFit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="css/auth.css">
    <script src="js/session.js" defer></script>
    <script src="js/auth.js" defer></script>
  </head>
  <body>
    <header class="auth-header">
      <a class="wordmark" href="index.html" aria-label="CareerFit home">CareerFit<span>.</span></a>
      <a class="back-link" href="index.html">Back to home</a>
    </header>

    <main class="auth-main">
      <section class="auth-card" aria-labelledby="auth-title">
        <a class="wordmark card-wordmark" href="index.html" aria-label="CareerFit home">CareerFit<span>.</span></a>
        <p class="eyebrow">Your next step starts here</p>
        <h1 id="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to continue your career journey.</p>
        <p class="demo-notice">Temporary demo only. Credentials are not verified by a server, and passwords are never stored.</p>

        <form class="auth-form" data-auth-form="login" novalidate>
          <div class="form-field">
            <label for="login-email">Email Address</label>
            <input
              id="login-email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
              aria-describedby="login-email-error"
            >
            <p class="field-error" id="login-email-error" aria-live="polite"></p>
          </div>

          <div class="form-field">
            <div class="label-row">
              <label for="login-password">Password</label>
              <a class="text-link forgot-link" href="#">Forgot password?</a>
            </div>
            <div class="password-control">
              <input
                id="login-password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                required
                aria-describedby="login-password-error"
              >
              <button class="password-toggle" type="button" aria-controls="login-password" aria-pressed="false">Show</button>
            </div>
            <p class="field-error" id="login-password-error" aria-live="polite"></p>
          </div>

          <label class="checkbox-row remember-row" for="remember-me">
            <input id="remember-me" name="remember" type="checkbox">
            <span>Remember me for 7 days</span>
          </label>

          <button class="submit-button" type="submit">Login</button>
          <p class="form-status" data-form-status role="status" aria-live="polite"></p>
        </form>

        <p class="auth-switch">
          Don't have an account?
          <a class="text-link" href="register.html">Create an account</a>
        </p>
      </section>
    </main>
  </body>
</html>
